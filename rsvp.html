<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Presença | Gabriella & Rafael</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .rsvp-container {
            max-width: 550px;
            margin: 50px auto;
            padding: 40px 30px;
            background: #FFFFFF;
            border: 2px solid var(--dourado-luxo, #D4AF37);
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: left;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            color: var(--verde-oliva, #4A5D2F);
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #CCC;
            border-radius: 4px;
            font-size: 0.95rem;
            font-family: 'Montserrat', sans-serif;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus, 
        .form-group select:focus, 
        .form-group textarea:focus {
            border-color: var(--verde-oliva, #4A5D2F);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--verde-oliva, #4A5D2F);
            color: #FFFFFF;
            border: 1px solid var(--dourado-luxo, #D4AF37);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            background: var(--dourado-luxo, #D4AF37);
            color: var(--verde-oliva, #4A5D2F);
        }
    </style>
</head>
<body>

    <!-- NAVEGAÇÃO -->
    <header>
        <div class="logo serif" style="font-size: 1.5rem; color: var(--verde-oliva, #4A5D2F); font-weight: bold;">G & R</div>
        <nav>
            <a href="index.html">Início</a>
            <a href="eventos.html">Eventos</a>
            <a href="rsvp.html">RSVP</a>
        </nav>
    </header>

    <!-- FORMULÁRIO DE RSVP -->
    <section>
        <h2 class="serif" style="font-size: 3rem; color: var(--verde-oliva, #4A5D2F);">Confirmação de Presença</h2>
        <p style="color: #666; margin-top: 5px;">Por favor, confirme sua presença até 30 dias antes do evento.</p>

        <div class="rsvp-container">
            <form id="rsvp-form">
                <!-- Nome do Convidado -->
                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                </div>

                <!-- Presença -->
                <div class="form-group">
                    <label for="confirmacao">Você irá ao casamento?</label>
                    <select id="confirmacao" name="confirmacao" required>
                        <option value="" disabled selected>Selecione uma opção</option>
                        <option value="Sim">Sim, com certeza estarei presente!</option>
                        <option value="Nao">Infelizmente não poderei ir</option>
                    </select>
                </div>

                <!-- Recado Opcional -->
                <div class="form-group">
                    <label for="mensagem">Deixe uma mensagem para os noivos (opcional):</label>
                    <textarea id="mensagem" name="mensagem" rows="4" placeholder="Escreva um carinho para nós..."></textarea>
                </div>

                <button type="submit" class="btn-submit">Enviar Confirmação</button>
            </form>
        </div>
    </section>

    <script>
        document.getElementById('rsvp-form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Obrigado por responder! Sua confirmação foi registrada com sucesso.');
            this.reset();
        });
    </script>
</body>
</html>
